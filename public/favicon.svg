<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dashed orbit ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#5566cc" stroke-width="1.5"
    stroke-dasharray="6 4" opacity="0.55">
    <animateTransform attributeName="transform" type="rotate"
      from="0 50 50" to="360 50 50" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Main Lua circle -->
  <circle cx="50" cy="50" r="34" fill="#12007d" filter="url(#glow)">
    <animate attributeName="r" values="34;35.5;34" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- White highlight -->
  <circle cx="38" cy="37" r="11" fill="white" opacity="0.95">
    <animate attributeName="opacity" values="0.95;0.72;0.95" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Small orbiting circle -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      from="0 50 50" to="360 50 50" dur="8s" repeatCount="indefinite"/>
    <circle cx="91" cy="50" r="10" fill="#12007d"/>
  </g>
</svg>
